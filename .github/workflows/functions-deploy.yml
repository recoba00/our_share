name: Firebase Functions Deploy (Blaze only)

on:
  workflow_dispatch:
    inputs:
      confirm_blaze_deploy:
        description: "Blaze 요금제로 전환했고 Functions 배포를 승인합니다"
        required: true
        type: boolean
        default: false

jobs:
  deploy-functions:
    if: ${{ inputs.confirm_blaze_deploy == true }}
    name: Build, test, and deploy Firebase Functions
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Validate service account and configure ADC
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 }}
        run: |
          node <<'NODE'
          const raw = process.env.SERVICE_ACCOUNT_JSON;
          let serviceAccount;

          try {
            serviceAccount = JSON.parse(raw);
          } catch {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 must be the full service account JSON object.');
          }

          if (serviceAccount.project_id !== 'our-share-6baf5') {
            throw new Error('The service account must belong to project our-share-6baf5.');
          }

          if (!serviceAccount.client_email || !serviceAccount.private_key) {
            throw new Error('The service account must include client_email and private_key.');
          }
          NODE

          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build Functions
        run: npm run build --prefix functions

      - name: Test Functions emulator sync
        run: npm run test:emulator --prefix functions

      - name: Deploy Functions
        run: npx -y firebase-tools@latest deploy --only functions --project our-share-6baf5 --non-interactive

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
