name: Firebase Hosting Deploy

on:
  push:
    branches: [ master ]

jobs:
  web-deploy:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Firebase emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test Firebase rules
        run: npm run test:rules

      - name: Validate Kakao Map JavaScript key
        env:
          VITE_KAKAO_MAP_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_MAP_JAVASCRIPT_KEY }}
        run: |
          if [ -z "$VITE_KAKAO_MAP_JAVASCRIPT_KEY" ]; then
            echo "VITE_KAKAO_MAP_JAVASCRIPT_KEY GitHub Secret is required for the map build."
            exit 1
          fi

      - name: Build Firebase Hosting candidate
        run: npm run build:firebase
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_KAKAO_MAP_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_MAP_JAVASCRIPT_KEY }}
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Verify Firebase Hosting candidate
        run: npm run test:dist:firebase

      - name: Configure Firebase service account for rules deploy
        if: env.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 != ''
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 }}
        run: |
          node <<'NODE'
          const raw = process.env.SERVICE_ACCOUNT_JSON;
          let serviceAccount;

          try {
            serviceAccount = JSON.parse(raw);
          } catch {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 must be the full service account JSON object.');
          }

          if (serviceAccount.project_id !== 'our-share-6baf5') {
            throw new Error('The service account must belong to project our-share-6baf5.');
          }

          if (!serviceAccount.client_email || !serviceAccount.private_key) {
            throw new Error('The service account must include client_email and private_key.');
          }
          NODE

          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore and Realtime Database Rules
        if: env.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 != ''
        run: |
          for attempt in 1 2 3 4 5; do
            if npx -y firebase-tools@latest deploy --only firestore:rules,database --project our-share-6baf5 --non-interactive; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Firebase Rules deploy failed on attempt $attempt. Retrying in 30 seconds for IAM propagation..."
              sleep 30
            fi
          done

          exit 1

      - name: Remove temporary Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 }}
          channelId: live
          projectId: our-share-6baf5

      - name: Verify Firebase Hosting deployment
        if: env.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 != ''
        run: npm run test:hosting
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          SMOKE_BASE_URL: https://our-share-6baf5.web.app
          SMOKE_RETRIES: 6
          SMOKE_RETRY_DELAY_MS: 10000

      - name: Skip Firebase Hosting deployment
        if: env.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 == ''
        run: |
          echo "Firebase Hosting deploy skipped."
          echo "Add FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 to GitHub Actions repository secrets."
