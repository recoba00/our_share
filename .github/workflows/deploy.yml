name: 🚀 Dothome Deploy

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: 🎉 Deploy to Dothome
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code from Git
        uses: actions/checkout@v4

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.recoba00.dothome.co.kr
          username: recoba00
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./html/our_share