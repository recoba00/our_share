name: Dothome Deploy

on:
  push:
    branches: [ master ]

jobs:
  web-deploy:
    name: Build and deploy to Dothome
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test Firestore rules
        run: npm run test:rules

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Verify dist output
        run: npm run test:dist

      - name: Deploy dist via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: recoba00.dothome.co.kr
          username: recoba00
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: html/our_share/

      - name: Verify Dothome deployment
        run: npm run test:hosting
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          SMOKE_BASE_URL: http://recoba00.dothome.co.kr/our_share
          SMOKE_RETRIES: 6
          SMOKE_RETRY_DELAY_MS: 10000
