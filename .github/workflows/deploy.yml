name: Firebase Hosting Deploy

on:
  push:
    branches: [ master ]

jobs:
  web-deploy:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test Firebase rules
        run: npm run test:rules

      - name: Build Firebase Hosting candidate
        run: npm run build:firebase
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_KAKAO_MAP_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_MAP_JAVASCRIPT_KEY }}
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Verify Firebase Hosting candidate
        run: npm run test:dist:firebase

      - name: Validate Firebase service account secret
        if: env.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 != ''
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 }}
        run: |
          node <<'NODE'
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;

          let serviceAccount;
          try {
            serviceAccount = JSON.parse(raw);
          } catch {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 must be the full Firebase service account JSON object.');
          }

          if (serviceAccount.project_id !== 'our-share-6baf5') {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 project_id must be our-share-6baf5.');
          }

          if (!serviceAccount.client_email || !serviceAccount.private_key) {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 must include client_email and private_key.');
          }

          console.log('Firebase service account secret shape is valid.');
          NODE

      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 }}
          channelId: live
          projectId: our-share-6baf5

      - name: Verify Firebase Hosting deployment
        if: env.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 != ''
        run: npm run test:hosting
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          SMOKE_BASE_URL: https://our-share-6baf5.web.app
          SMOKE_RETRIES: 6
          SMOKE_RETRY_DELAY_MS: 10000

      - name: Skip Firebase Hosting deployment
        if: env.FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 == ''
        run: |
          echo "Firebase Hosting deploy skipped."
          echo "Add FIREBASE_SERVICE_ACCOUNT_OUR_SHARE_6BAF5 to GitHub Actions repository secrets."
